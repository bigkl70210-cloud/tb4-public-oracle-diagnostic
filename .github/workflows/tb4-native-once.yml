name: TB4 pinned Codex GPT-6.1 Sol one-shot #5

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tb4-native-once.yml

permissions:
  contents: read

concurrency:
  group: tb4-public-codex-20261009-one-shot-5
  cancel-in-progress: false

jobs:
  codex-bounded:
    if: github.run_number == 5 && github.run_attempt == 1 && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: tb4-once
    env:
      TB_PIN: 452bf305c6daa62fc59061d22133a7cbc7c1572e
      HARBOR_PIN: 4b94505a91c5ddcb70b5740ac95718ddee13e5a0
      MODEL: gpt-6.1-sol
      DO_NOT_TRACK: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout public diagnostics with no persistent Git credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Fail-closed one-shot identity and Docker prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_NUMBER" = 5
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" = refs/heads/main
          test "$MODEL" = gpt-6.1-sol
          test "$(docker info --format '{{.NCPU}}')" -ge 2
          test -z "$(printenv OPENAI_API_KEY || true)"
          echo "ONE_SHOT_IDENTITY_AND_EMPTY_PROVIDER_ENV_PASS"

      - name: Acquire pinned official TB4 and Harbor sources
        shell: bash
        run: |
          set -euo pipefail
          git init -q tb-source
          git -C tb-source remote add origin https://github.com/harbor-framework/terminal-bench.git
          git -C tb-source sparse-checkout init --no-cone
          printf '/tasks/session-window-debug/\n' > tb-source/.git/info/sparse-checkout
          git -C tb-source fetch --quiet --depth=1 --filter=blob:none origin "$TB_PIN"
          git -C tb-source checkout --quiet --detach FETCH_HEAD
          test "$(git -C tb-source rev-parse HEAD)" = "$TB_PIN"
          git init -q harbor-source
          git -C harbor-source remote add origin https://github.com/harbor-framework/harbor.git
          git -C harbor-source fetch --quiet --depth=1 --filter=blob:none origin "$HARBOR_PIN"
          git -C harbor-source checkout --quiet --detach FETCH_HEAD
          test "$(git -C harbor-source rev-parse HEAD)" = "$HARBOR_PIN"
          python3 - <<'PY'
          from pathlib import Path
          import tomllib
          source=Path("tb-source/tasks/session-window-debug")
          t=tomllib.loads((source/"task.toml").read_text())
          assert t["task"]["name"]=="terminal-bench/session-window-debug"
          assert t["verifier"]["environment_mode"]=="separate"
          assert (source/"tests/test.sh").is_file()
          assert tomllib.loads(Path("harbor-source/pyproject.toml").read_text())["project"]["version"]=="0.24.0"
          print("OFFICIAL_SOURCE_PINS_PASS")
          PY

      - name: Prepare Harbor and agent-only provider network allowance
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --no-input --quiet ./harbor-source
          .venv/bin/harbor --version
          cp -a tb-source/tasks/session-window-debug isolated-task
          python3 - <<'PY'
          from pathlib import Path
          import tomllib
          p=Path("isolated-task/task.toml")
          src=p.read_text()
          assert src.count("[agent]\n")==1
          src=src.replace("[agent]\n","[agent]\nnetwork_mode = 'allowlist'\nallowed_hosts = ['api.openai.com']\n",1)
          cfg=tomllib.loads(src)
          assert cfg["agent"]["network_mode"]=="allowlist"
          assert cfg["agent"]["allowed_hosts"]==["api.openai.com"]
          p.write_text(src)
          print("SOURCE_FROZEN_NETWORK_ISOLATION_APPLIED")
          PY

      - name: One model run through official Harbor and Codex only
        id: measured
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.TB4_META_Q1_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY"
          case "$OPENAI_API_KEY" in sk-*) ;; *) exit 3;; esac
          echo "::add-mask::$OPENAI_API_KEY"
          mkdir -p tb4-measurement
          set +e
          timeout --signal=TERM --kill-after=15s 1200s .venv/bin/harbor run \
            --path ./isolated-task \
            --agent codex --model "$MODEL" --env docker \
            --agent-kwarg version=0.161.0 \
            --agent-kwarg web_search=disabled \
            --effort low --agent-timeout-multiplier 0.025 \
            --n-attempts 1 --max-retries 0 --n-concurrent 1 \
            --job-name tb4-sol-one-shot-five --jobs-dir ./tb4-measurement \
            > ./harbor-native.stdout 2> ./harbor-native.stderr
          result=$?
          set -e
          echo "HARBOR_PROCESS_EXIT=$result"
          exit "$result"

      - name: Minimal scorer-owned result receipt, no transcript upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          paths=list(Path("tb4-measurement").rglob("result.json"))
          rows=[]
          for p in paths:
              try:d=json.loads(p.read_text())
              except (OSError,ValueError):continue
              if isinstance(d,dict) and d.get("trial_name"):rows.append(d)
          assert len(rows)<=1,"AMBIGUOUS_TRIAL_RESULT"
          d=rows[0] if rows else {}
          vr=d.get("verifier_result") or {}
          rewards=vr.get("rewards") if isinstance(vr,dict) else None
          er=d.get("exception_info")
          agent=d.get("agent_info") or {}
          result={"native_result_found":bool(rows),"agent":agent.get("name"),
                  "verifier_mode":d.get("verifier_environment_mode"),
                  "reward":rewards if isinstance(rewards,dict) else None,
                  "exception_type":er.get("exception_type") if isinstance(er,dict) else None,
                  "model":"gpt-6.1-sol",
                  "claim_ceiling":"single-task-bounded-not-model-promotion"}
          print("TB4_MINIMAL_RECEIPT="+json.dumps(result,sort_keys=True))
          PY
          {
            echo '## TB4 GPT-6.1 Sol pinned one-shot #5'
            echo 'Old runs #1/#2/#3/#4 CLOSED NONREPLAY; no replay.'
            echo 'Official frozen session-window-debug, independent Harbor verifier.'
            echo 'One agent, one attempt, zero retries; max 720 seconds agent phase.'
            echo 'Meta Q1 key referenced only from tb4-once Environment; no artifact uploaded.'
            echo 'API billing limit is operational, not a guaranteed provider hard cap; check Platform usage.'
            echo 'One task cannot prove model promotion or scientific parity.'
          } >> "$GITHUB_STEP_SUMMARY"
